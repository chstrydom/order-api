[project]
name = "order-api"
version = "0.1.0"
description = "Order Management capability for Mr D Tech Vetting Assignment"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]


[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # flake8-bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "SIM",      # simplifications
    "PT",       # pytest style
    "S",        # bandit security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # allow `assert` in tests
