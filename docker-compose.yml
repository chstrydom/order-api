services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: order_api
      POSTGRES_USER: order_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_api -d order_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: